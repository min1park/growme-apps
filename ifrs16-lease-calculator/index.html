<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFRS 16 리스 계산기 v5.0 결산보고서</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { margin: 0; background: #0f172a; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ================================================================
// IFRS 16 리스 계산기 v5.0 (결산 보고서 기능 추가)
// ================================================================

const CAT_PREFIX = { '부동산': 'R', '차량운반구': 'V', '기계장치': 'M', '비품': 'F' };
const FREQ_OPTIONS = [
  { v: 1, l: '매월 (1개월)' },
  { v: 2, l: '격월 (2개월)' },
  { v: 3, l: '분기 (3개월)' },
  { v: 6, l: '반기 (6개월)' },
  { v: 12, l: '연 (12개월)' }
];

const fmt = (n) => Math.round(n).toLocaleString();
const toISO = (d) => {
  const o = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - o).toISOString().split('T')[0];
};
const parseDate = (v) => {
  if (!v) return '';
  if (typeof v === 'number') return new Date((v - 25569) * 86400000).toISOString().split('T')[0];
  return String(v).split('T')[0];
};

const genLeaseId = (category, allLeases) => {
  const prefix = CAT_PREFIX[category] || 'X';
  const year = new Date().getFullYear();
  const nums = allLeases
    .filter(l => l.lease_id && l.lease_id.startsWith(`${prefix}-${year}-`))
    .map(l => parseInt(l.lease_id.split('-')[2]) || 0);
  const next = nums.length > 0 ? Math.max(...nums) + 1 : 1;
  return `${prefix}-${year}-${String(next).padStart(3, '0')}`;
};

// ================================================================
// 계산 엔진
// ================================================================
const calcMonthsByDate = (s, e) => {
  if (!s || !e) return 0;
  const sd = new Date(s), ed = new Date(e);
  return Math.max(0, (ed.getFullYear()-sd.getFullYear())*12 + (ed.getMonth()-sd.getMonth()) + 1);
};

const getPayDates = (startDate, totalMonths, timing, freq = 1) => {
  const items = [];
  const s = new Date(startDate);
  s.setDate(1); 
  s.setHours(12,0,0,0); 

  for (let i = 0; i < totalMonths; i += freq) {
    const monthsInPeriod = Math.min(freq, totalMonths - i);
    let d;
    
    if (timing === 'prepaid') {
      d = new Date(s.getFullYear(), s.getMonth() + i, 1);
    } else {
      d = new Date(s.getFullYear(), s.getMonth() + i + monthsInPeriod, 0);
    }
    
    d.setHours(12,0,0,0);
    items.push({ date: d, monthsCovered: monthsInPeriod });
  }
  return items;
};

const calcAnnuityPV = (rate, n, pmt, residual, timing, months, freq) => {
  if (rate === 0) return (pmt * n) + residual;

  const periodRate = Math.pow(1 + rate, freq) - 1;

  let annuityFactor = 0;
  if (timing === 'prepaid') {
    if (n === 1) annuityFactor = 1;
    else annuityFactor = 1 + (1 - Math.pow(1 + periodRate, -(n - 1))) / periodRate;
  } else {
    annuityFactor = (1 - Math.pow(1 + periodRate, -n)) / periodRate;
  }
  const pmtPV = pmt * annuityFactor;

  const resPV = residual > 0 ? residual * Math.pow(1 + rate, -months) : 0;

  return pmtPV + resPV;
};

const computeLease = (lease) => {
  try {
    const userMonths = parseInt(lease.leaseTerm);
    const dateMonths = calcMonthsByDate(lease.startDate, lease.endDate);
    const months = (userMonths > 0) ? userMonths : dateMonths;

    if (months === 0) return { 
      error: '리스 기간이 0개월입니다.',
      months:0, schedule:[], cashFlows:[], subleaseSchedule:[]
    };

    const freq = parseInt(lease.paymentFrequency || 1);
    const annRate = (parseFloat(lease.ibrRate)||0)/100;
    
    if (annRate < 0) {
      return { error: '이자율은 0% 이상이어야 합니다.', months, schedule:[], cashFlows:[], subleaseSchedule:[] };
    }
    
    // [F2] 할인율 환산방식: compound=(1+r)^(1/12)-1 (기본) / simple=r/12 (회사식 단리)
    const rateMethod = lease.rateMethod || 'compound';
    // [F10] 리스부채 상환배분: effective=실효이자율법(기본) / pv=회사식(원금=현재가치)
    const liabMethod = lease.liabilityMethod || 'effective';
    const monRate = annRate > 0
      ? (rateMethod === 'simple' ? annRate/12 : Math.pow(1 + annRate, 1/12) - 1)
      : 0;

    const pmt = parseFloat(lease.monthlyPayment)||0;
    const prepaid = parseFloat(lease.prepaidLease)||0;
    const directCost = parseFloat(lease.initialDirectCost)||0;
    const incentive = parseFloat(lease.leaseIncentive)||0;
    const residual = parseFloat(lease.residualValue)||0;
    // [F1] 복구충당부채: 초기 인식액(현재가치/충당금). 별도 할인율 미입력 시 리스 IBR 사용
    const restoration = parseFloat(lease.restorationCost)||0;
    const restRate = lease.restorationRate ? (parseFloat(lease.restorationRate)/100) : annRate;
    const restMonRate = restRate > 0
      ? (rateMethod === 'simple' ? restRate/12 : Math.pow(1 + restRate, 1/12) - 1)
      : 0;

    // [F11] 임차보증금: 명목금액을 리스 IBR로 만기까지 할인 → 현재가치할인차금(=명목-PV)을
    //       사용권자산 취득원가에 가산(IFRS16 초기직접원가 성격). 매기 보증금 이자수익 unwinding 산출.
    const deposit = parseFloat(lease.depositAmount)||0;
    const depositPV = deposit > 0 ? deposit * Math.pow(1 + monRate, -months) : 0;
    const depositDiscount = deposit - depositPV;   // 현재가치할인차금 (ROU 취득원가 가산분)

    // [F9] 변동 리스료: 회차별 금액 배열 (콤마/공백 구분). 있으면 단일 pmt 대신 사용
    let customPayments = null;
    if (lease.customPayments && String(lease.customPayments).trim()) {
      customPayments = String(lease.customPayments).split(/[,\s]+/).map(x => parseFloat(x)).filter(x => !isNaN(x));
      if (customPayments.length === 0) customPayments = null;
    }

    if (pmt <= 0 && !customPayments) {
      return { error: '리스료는 0보다 커야 합니다.', months, schedule:[], cashFlows:[], subleaseSchedule:[] };
    }

    const payItems = getPayDates(lease.startDate, months, lease.paymentTiming, freq);
    // [F9] 회차별 지급액 helper (변동이면 배열값, 아니면 단일 pmt. 배열이 짧으면 마지막값 반복)
    const payAt = (idx) => customPayments ? (customPayments[idx] !== undefined ? customPayments[idx] : customPayments[customPayments.length-1]) : pmt;

    const startDateObj = new Date(lease.startDate);
    startDateObj.setDate(1); startDateObj.setHours(12,0,0,0);

    const cashFlows = [];
    cashFlows.push({ seq: 0, date: toISO(startDateObj), amount: 0, description: '기준일' });

    payItems.forEach((item, idx) => {
      cashFlows.push({
        seq: idx + 1,
        date: item.date.toISOString().split('T')[0],
        amount: payAt(idx),
        description: `${idx+1}회차`
      });
    });

    if (residual > 0) {
      const endDate = new Date(lease.endDate);
      endDate.setHours(12,0,0,0);
      cashFlows.push({
        seq: '잔존',
        date: toISO(endDate),
        amount: residual,
        description: '잔존가치보증'
      });
    }

    const numPayments = payItems.length;
    // [F10] 회사식(pv) 현가계수 지수: 회차(1부터), 선급 첫회도 ^1. 실효이자율법: 선급 첫회 ^0
    const discExp = (i) => (liabMethod === 'pv') ? (i+1)*freq
      : (lease.paymentTiming === 'prepaid' ? i*freq : (i+1)*freq);
    // [F9/F10] 변동 또는 회사식이면 회차별 현재가치 합산, 아니면 연금현가 공식
    let pvLeasePayments;
    if (customPayments || liabMethod === 'pv') {
      pvLeasePayments = 0;
      for (let i = 0; i < numPayments; i++) {
        const disc = Math.pow(1+monRate, -discExp(i));
        // [F10] 회사식은 회차별 반올림 합산(회사 상각표 재현), 실효법은 반올림 없이
        pvLeasePayments += (liabMethod === 'pv') ? Math.round(payAt(i) * disc) : payAt(i) * disc;
      }
      if (residual > 0) pvLeasePayments += residual * Math.pow(1+monRate, -months);
    } else {
      pvLeasePayments = calcAnnuityPV(monRate, numPayments, pmt, residual, lease.paymentTiming, months, freq);
    }

    const isModification = lease.isModification;
    let carryLiab = 0, carryROU = 0, carryCost = 0, carryAccumDepr = 0;
    
    if (isModification) {
      carryLiab = parseFloat(lease.carriedOverLiability)||0;
      carryROU = parseFloat(lease.carriedOverROU)||0;
      carryCost = parseFloat(lease.carriedOverAssetCost)||0;
      carryAccumDepr = parseFloat(lease.carriedOverAccumDepreciation)||0;
      
      if (carryLiab === 0 || carryROU === 0) {
        return { error: '변경 계약은 이월 부채 및 자산 입력 필수입니다.', months, schedule:[], cashFlows:[], subleaseSchedule:[] };
      }
    }

    const initialLiability = isModification ? carryLiab : pvLeasePayments;
    // [F1] IFRS16.24(d): 복구충당부채(원상복구원가 추정치)를 사용권자산 취득원가에 가산
    // [F11] 임차보증금 현재가치할인차금도 취득원가에 가산
    const assetCost = isModification
      ? carryCost
      : pvLeasePayments + prepaid + directCost - incentive + restoration + depositDiscount;
    const initialROU = isModification ? carryROU : assetCost;

    let effectiveMonths = months;
    let subleaseStartPeriod = null;
    let isFinanceSublease = false;

    if (lease.isSublease && lease.subleaseType === 'finance' && lease.subleaseStartDate) {
      const subStart = new Date(lease.subleaseStartDate);
      const leaseStart = new Date(lease.startDate);
      const subMonth = Math.max(0, (subStart.getFullYear()-leaseStart.getFullYear())*12 + (subStart.getMonth()-leaseStart.getMonth()));
      
      if (subMonth < months) {
        isFinanceSublease = true;
        effectiveMonths = subMonth;
        subleaseStartPeriod = subMonth + 1;
      }
    }

    // [F3] 상각방식: straight=취득원가/기간(기본) / liability=리스부채PV/기간(회사식)
    const depMethod = lease.depreciationMethod || 'straight';
    const depBase = (depMethod === 'liability' && !isModification) ? pvLeasePayments : (isModification ? carryCost : assetCost);
    const monthlyDepreciation = effectiveMonths > 0 ? depBase / effectiveMonths : 0;

    const schedule = [];
    let liab = initialLiability;
    let nbv = initialROU;
    let accumDepreciation = isModification ? carryAccumDepr : 0;
    let restBal = restoration; // [F1] 복구충당부채 잔액 (unwinding 추적)
    let depBal = depositPV;    // [F11] 임차보증금 현재가치 잔액 (unwinding 추적, 만기시 명목 도달)

    for (let m = 0; m < months; m++) {
      const paymentIdx = Math.floor(m / freq);
      let isPaidThisMonth = (m % freq === 0) && paymentIdx < numPayments;
      if (lease.paymentTiming === 'postpaid' && m % freq === (freq - 1) && paymentIdx < numPayments) {
        isPaidThisMonth = true;
      }
      
      const paymentDate = isPaidThisMonth 
        ? payItems[paymentIdx].date.toISOString().split('T')[0] 
        : '';

      const isSubleasePeriod = isFinanceSublease && m >= subleaseStartPeriod - 1;

      const beginLiability = liab;
      const payment = isPaidThisMonth ? payAt(paymentIdx) : 0;  // [F9] 회차별 지급액
      let interest, principal;
      if (liabMethod === 'pv' && isPaidThisMonth) {
        // [F10] 회사식: 원금상환 = ROUND(현금 x 현가계수), 이자 = 지급 - 원금. 지수는 discExp와 동일
        const disc = Math.pow(1+monRate, -discExp(paymentIdx));
        principal = Math.round(payment * disc);
        interest = payment - principal;
      } else {
        // 표준 실효이자율법: 이자 = 기초부채 x 이자율, 원금 = 지급 - 이자
        interest = liab * monRate;
        principal = payment - interest;
      }
      const endLiability = Math.max(0, liab - principal);

      let currentDepreciation = 0;
      if (!isSubleasePeriod) {
        currentDepreciation = monthlyDepreciation;
        accumDepreciation += currentDepreciation;
        nbv = Math.max(0, nbv - currentDepreciation);
      }

      // [F1] 복구충당부채 unwinding (전입이자): 기초잔액 x 월할인율
      const restBegin = restBal;
      const restAccretion = restBal * restMonRate;
      const restEnd = restBal + restAccretion;
      restBal = restEnd;

      // [F11] 임차보증금 unwinding (이자수익): 기초 현재가치 x 월할인율
      const depBegin = depBal;
      const depAccretion = deposit > 0 ? depBal * monRate : 0;
      const depEnd = depBal + depAccretion;
      depBal = depEnd;

      schedule.push({
        period: m + 1,
        paymentDate: paymentDate || '',
        beginLiability: beginLiability,
        interest: interest,
        payment: payment,
        principal: principal,
        endLiability: endLiability,
        monthlyDepreciation: currentDepreciation,
        netBookValue: nbv,
        accumulatedDepreciation: accumDepreciation,
        isSubleasePeriod: isSubleasePeriod,
        restBeginBalance: restBegin,       // [F1]
        restAccretion: restAccretion,      // [F1]
        restEndBalance: restEnd,           // [F1]
        depBeginBalance: depBegin,         // [F11]
        depAccretion: depAccretion,        // [F11]
        depEndBalance: depEnd              // [F11]
      });

      liab = endLiability;
    }

    let subleaseSchedule = [];
    let subleaseReceivable = 0;

    if (isFinanceSublease && subleaseStartPeriod) {
      const remainingLiability = schedule[subleaseStartPeriod - 2]?.endLiability || 0;
      const remainingNBV = schedule[subleaseStartPeriod - 2]?.netBookValue || 0;

      subleaseReceivable = remainingLiability;
      const subMonths = months - (subleaseStartPeriod - 1);

      if (subMonths > 0) {
        let receivable = subleaseReceivable;
        const subCollectionPerMonth = pmt;

        for (let s = 0; s < subMonths; s++) {
          const paymentIdx = Math.floor((subleaseStartPeriod - 1 + s) / freq);
          let isCollected = ((subleaseStartPeriod - 1 + s) % freq === 0) && paymentIdx < numPayments;
          if (lease.paymentTiming === 'postpaid' && (subleaseStartPeriod - 1 + s) % freq === (freq - 1) && paymentIdx < numPayments) {
            isCollected = true;
          }

          const beginReceivable = receivable;
          const interestIncome = receivable * monRate;
          const collection = isCollected ? subCollectionPerMonth : 0;
          const principalCollection = collection - interestIncome;
          const endReceivable = Math.max(0, receivable - principalCollection);

          subleaseSchedule.push({
            seq: s + 1,
            date: isCollected ? payItems[paymentIdx].date.toISOString().split('T')[0] : '',
            beginReceivable: beginReceivable,
            interestIncome: interestIncome,
            collection: collection,
            principalCollection: principalCollection,
            endReceivable: endReceivable
          });

          receivable = endReceivable;
        }
      }
    }

    // [F12] 중도해지·만기종료 파생처리: 해지일까지 상각 후 잔여 리스부채 derecognition + 사용권자산 처분
    //   terminationType: 'early'(중도해지) | 'maturity'(만기종료) | '' (계속)
    //   해지일 기준 마지막 지급회차까지 상각하고, 잔여 리스부채·ROU 순액을 제거. 처분손익 = 부채감소 - ROU순액감소
    let termination = null;
    if (lease.terminationDate && (lease.terminationType === 'early' || lease.terminationType === 'maturity')) {
      const termDate = new Date(lease.terminationDate);
      const start = new Date(lease.startDate);
      // 해지일까지 지급완료 회차수 (후급: 지급일 = 개시일+n개월)
      let n = (termDate.getFullYear()-start.getFullYear())*12 + (termDate.getMonth()-start.getMonth());
      if (termDate.getDate() < start.getDate()) n -= 1;
      n = Math.max(0, Math.min(n, schedule.length));
      const row = n >= 1 ? schedule[n-1] : null;
      const remLiab = row ? row.endLiability : initialLiability;      // 제거할 리스부채
      const remROU = row ? row.netBookValue : initialROU;             // 제거할 사용권자산 순액
      const remDepBal = row ? row.depEndBalance : depositPV;          // 보증금 현재가치 잔액(반환)
      const remRestBal = row ? row.restEndBalance : restoration;      // 복구충당 잔액
      const disposalPL = remLiab - remROU;                           // 처분손익 (부채>순액이면 이익)
      termination = {
        type: lease.terminationType, date: lease.terminationDate,
        lastPeriod: n,
        liabilityDerecognized: remLiab,
        rouDerecognized: remROU,
        depositReturned: remDepBal,
        restorationDerecognized: remRestBal,
        disposalGainLoss: disposalPL      // (+)=처분이익, (-)=처분손실
      };
    }

    return {
      months,
      initialLiability,
      initialROU,
      assetCost,
      monthlyDepreciation,
      schedule,
      cashFlows,
      isFinanceSublease,
      subleaseSchedule,
      subleaseReceivable,
      restorationInitial: restoration,                                    // [F1]
      restorationEnd: schedule.length ? schedule[schedule.length-1].restEndBalance : restoration, // [F1]
      rateMethod,                                                         // [F2]
      depreciationMethod: depMethod,                                      // [F3]
      liabilityMethod: liabMethod,                                        // [F10]
      pvLeasePayments,                                                    // [F5 대사용]
      depositAmount: deposit,                                             // [F11]
      depositPV,                                                          // [F11]
      depositDiscount,                                                    // [F11] 현재가치할인차금(ROU 가산분)
      depositEnd: schedule.length ? schedule[schedule.length-1].depEndBalance : depositPV, // [F11]
      termination                                                        // [F12]
    };

  } catch (err) {
    return { error: `계산 오류: ${err.message}`, months:0, schedule:[], cashFlows:[], subleaseSchedule:[] };
  }
};

// ================================================================
// [F13] 회계처리(분개) 생성 — 리스 회계처리 표준 방식
//   초기인식 + 회차별(이자·감가·복구이자·보증금이자·리스료지급) + 종료(derecognition)
//   asOfDate 지정 시 해당일까지의 분개만 반환(결산 분개 미리보기)
// ================================================================
const cat = (c) => c || '자산';
const generateJournalEntries = (lease, asOfDate) => {
  const calc = lease.calculatedData;
  if (!calc || calc.error || !calc.schedule) return [];
  const entries = [];
  const C = cat(lease.assetCategory);
  const rou = `사용권자산_${C}`, accdep = `사용권자산상각누계액_${C}`;
  const liab = `리스부채_${C}`, dep = `사용권자산상각비_${C}`;
  const start = lease.startDate;
  const asOf = asOfDate ? new Date(asOfDate) : null;

  // ── 1. 초기 인식 (개시일) ──
  if (!lease.isModification) {
    const initLines = [];
    initLines.push({ acct: rou, dr: Math.round(calc.assetCost), cr: 0 });
    if (calc.depositDiscount > 0) {
      // 임차보증금 명목 계상(차) + 현재가치할인차금(대) → 순액 PV. 취득원가엔 현할차가 이미 가산됨.
      // 보증금 지급현금은 명목액(대). 결과적으로 임차보증금(차 명목)−현할차(대)−현금(대 명목)로 균형.
      initLines.push({ acct: `임차보증금`, dr: Math.round(calc.depositAmount), cr: 0 });
      initLines.push({ acct: `현재가치할인차금(임차보증금)`, dr: 0, cr: Math.round(calc.depositDiscount) });
      initLines.push({ acct: `현금`, dr: 0, cr: Math.round(calc.depositAmount) });
    }
    initLines.push({ acct: liab, dr: 0, cr: Math.round(calc.initialLiability) });
    if (calc.restorationInitial > 0)
      initLines.push({ acct: `복구충당부채_${C}`, dr: 0, cr: Math.round(calc.restorationInitial) });
    entries.push({ date: start, seq: '개시', desc: '리스 개시 — 사용권자산·리스부채 인식', lines: initLines });
  }

  // ── 2. 회차별 분개 (이자·감가·복구·보증금·리스료지급) ──
  calc.schedule.forEach(row => {
    const d = row.paymentDate || '';
    if (asOf && d && new Date(d) > asOf) return;
    const lines = [];
    // (a) 리스부채 이자
    if (row.interest > 0.5) lines.push({ acct: `이자비용`, dr: Math.round(row.interest), cr: 0 });
    // (b) 리스료 지급: 리스부채 원금 + 이자 = 현금
    if (row.payment > 0.5) {
      lines.push({ acct: liab, dr: Math.round(row.principal), cr: 0 });
      lines.push({ acct: `현금`, dr: 0, cr: Math.round(row.payment) });
    }
    // (c) 감가상각
    if (row.monthlyDepreciation > 0.5) {
      lines.push({ acct: dep, dr: Math.round(row.monthlyDepreciation), cr: 0 });
      lines.push({ acct: accdep, dr: 0, cr: Math.round(row.monthlyDepreciation) });
    }
    // (d) 복구충당 unwinding
    if (row.restAccretion > 0.5) {
      lines.push({ acct: `이자비용(복구충당)`, dr: Math.round(row.restAccretion), cr: 0 });
      lines.push({ acct: `복구충당부채_${C}`, dr: 0, cr: Math.round(row.restAccretion) });
    }
    // (e) 임차보증금 이자수익
    if (row.depAccretion > 0.5) {
      lines.push({ acct: `현재가치할인차금(임차보증금)`, dr: Math.round(row.depAccretion), cr: 0 });
      lines.push({ acct: `이자수익`, dr: 0, cr: Math.round(row.depAccretion) });
    }
    if (lines.length)
      entries.push({ date: d || `회차${row.period}`, seq: row.period, desc: `${row.period}회차 정기분개`, lines });
  });

  // ── 3. 종료 분개 (중도해지·만기종료 derecognition) ──
  if (calc.termination) {
    const t = calc.termination;
    if (!asOf || new Date(t.date) <= asOf) {
      const lines = [];
      lines.push({ acct: liab, dr: Math.round(t.liabilityDerecognized), cr: 0 });         // 잔여 부채 제거
      lines.push({ acct: accdep, dr: Math.round(calc.assetCost - t.rouDerecognized), cr: 0 }); // 상각누계 제거
      lines.push({ acct: rou, dr: 0, cr: Math.round(calc.assetCost) });                    // 사용권자산 원가 제거
      const pl = Math.round(t.disposalGainLoss);
      if (pl > 0) lines.push({ acct: `사용권자산처분이익`, dr: 0, cr: pl });
      else if (pl < 0) lines.push({ acct: `사용권자산처분손실`, dr: -pl, cr: 0 });
      entries.push({ date: t.date, seq: '종료',
        desc: `${t.type==='early'?'중도해지':'만기종료'} — 리스부채·사용권자산 제거`, lines });
    }
  }
  return entries;
};

// ================================================================
const generateAnnualReport = (leases, fiscalYear) => {
  const fy = parseInt(fiscalYear);
  const beginDate = `${fy-1}-12-31`;
  const endDate = `${fy}-12-31`;
  
  // 활성 리스만 필터링
  const activeLeases = leases.filter(l => l.status === 'active' && l.calculatedData && !l.calculatedData.error);
  
  // 자산군별 그룹화
  const categories = ['부동산', '차량운반구', '기계장치', '비품'];
  const report = {};
  
  categories.forEach(cat => {
    const catLeases = activeLeases.filter(l => l.assetCategory === cat);
    if (catLeases.length === 0) return;
    
    // 신규/기존 분류
    const newLeases = catLeases.filter(l => {
      const startYear = new Date(l.startDate).getFullYear();
      return startYear === fy;
    });
    const existingLeases = catLeases.filter(l => {
      const startYear = new Date(l.startDate).getFullYear();
      return startYear < fy;
    });
    
    // 리스부채 집계
    const liabBegin = sumBalanceAtDate(existingLeases, beginDate, 'liability');
    const liabEnd = sumBalanceAtDate(catLeases, endDate, 'liability');
    const liabNew = sumInitialBalances(newLeases, fy, 'liability');
    const liabInterest = sumPeriodItems(catLeases, fy, 'interest');
    const liabPrincipal = sumPeriodItems(catLeases, fy, 'principal');
    const liabIncrease = liabNew;
    const liabDecrease = liabPrincipal;
    
    // 사용권자산 집계
    const rouBegin = sumBalanceAtDate(existingLeases, beginDate, 'rou');
    const rouEnd = sumBalanceAtDate(catLeases, endDate, 'rou');
    const rouNew = sumInitialBalances(newLeases, fy, 'rou');
    const rouDepreciation = sumPeriodItems(catLeases, fy, 'depreciation');
    const rouIncrease = rouNew;
    const rouDecrease = 0; // 종료로 인한 감소는 별도 추적 필요
    
    report[cat] = {
      newLeases: newLeases.length,
      existingLeases: existingLeases.length,
      liability: {
        begin: liabBegin,
        increase: liabIncrease,
        interest: liabInterest,
        decrease: liabDecrease,
        end: liabEnd
      },
      rou: {
        begin: rouBegin,
        increase: rouIncrease,
        depreciation: rouDepreciation,
        decrease: rouDecrease,
        end: rouEnd
      }
    };
  });
  
  return report;
};

// [F4] 정확한 달력월 기반 경과기간 (calcMonthsByDate와 동일 의미, 포함)
const monthsElapsedInclusive = (startStr, asOfStr) => {
  const s = new Date(startStr), a = new Date(asOfStr);
  return (a.getFullYear()-s.getFullYear())*12 + (a.getMonth()-s.getMonth()) + 1;
};

// [F4] 임의 결산일(as-of) 시점의 개별 리스 잔액·기간발생액
const getBalancesAsOf = (lease, asOfDate) => {
  const calc = lease.calculatedData;
  const zero = { liability:0, rou_cost:0, accumDepr:0, rou_nbv:0, restorationBal:0, periodInterest:0, periodDepr:0, active:false };
  if (!calc || !calc.schedule || calc.error) return zero;
  const start = new Date(lease.startDate), end = new Date(lease.endDate), asOf = new Date(asOfDate);
  if (asOf < start) return zero; // 개시 전
  let idx = monthsElapsedInclusive(lease.startDate, asOfDate);
  idx = Math.max(1, Math.min(idx, calc.schedule.length));
  const row = calc.schedule[idx-1];
  if (!row) return zero;
  return {
    liability: row.endLiability,
    rou_cost: calc.assetCost,
    accumDepr: row.accumulatedDepreciation,
    rou_nbv: row.netBookValue,
    restorationBal: row.restEndBalance || 0,
    periodInterest: row.interest,
    periodDepr: row.monthlyDepreciation,
    active: asOf <= end
  };
};

// [F4] 임의 결산일 기준 자산군별 롤포워드 (연말 고정이 아닌 반기/분기 지원)
const generatePeriodReport = (leases, asOfDate, categories) => {
  const asOf = new Date(asOfDate);
  const fy = asOf.getFullYear();
  const beginDate = `${fy-1}-12-31`;
  const cats = categories || ['부동산', '차량운반구', '기계장치', '비품'];
  const activeLeases = leases.filter(l => l.status === 'active' && l.calculatedData && !l.calculatedData.error);
  const report = {};

  cats.forEach(cat => {
    const catLeases = activeLeases.filter(l => l.assetCategory === cat);
    if (catLeases.length === 0) return;
    const existingLeases = catLeases.filter(l => new Date(l.startDate).getFullYear() < fy);
    const newLeases = catLeases.filter(l => new Date(l.startDate).getFullYear() === fy);

    let liabBegin=0, liabEnd=0, liabNew=0, liabInterest=0, liabPrincipal=0;
    let rouBegin=0, rouEnd=0, rouNew=0, rouDepr=0;
    let restBegin=0, restEnd=0, restAccr=0;

    existingLeases.forEach(l => {
      const b = getBalancesAsOf(l, beginDate);
      liabBegin += b.liability; rouBegin += b.rou_nbv; restBegin += b.restorationBal;
    });
    newLeases.forEach(l => {
      liabNew += l.calculatedData.initialLiability || 0;
      rouNew  += l.calculatedData.initialROU || 0;
    });
    catLeases.forEach(l => {
      const e = getBalancesAsOf(l, asOfDate);
      liabEnd += e.liability; rouEnd += e.rou_nbv; restEnd += e.restorationBal;
      // 당기(회계연도초~as-of) 발생액 누계
      const calc = l.calculatedData;
      const startIdx = monthsElapsedInclusive(l.startDate, `${fy-1}-12-31`); // 기초 다음달부터
      const endIdx = Math.min(monthsElapsedInclusive(l.startDate, asOfDate), calc.schedule.length);
      for (let i = Math.max(1, startIdx+1); i <= endIdx; i++) {
        const r = calc.schedule[i-1]; if (!r) continue;
        liabInterest += r.interest; liabPrincipal += r.principal;
        rouDepr += r.monthlyDepreciation; restAccr += (r.restAccretion || 0);
      }
    });

    report[cat] = {
      newLeases: newLeases.length, existingLeases: existingLeases.length,
      liability: { begin: liabBegin, increase: liabNew, interest: liabInterest, decrease: liabPrincipal, end: liabEnd },
      rou:       { begin: rouBegin,  increase: rouNew,  depreciation: rouDepr,   decrease: 0,             end: rouEnd },
      restoration: { begin: restBegin, accretion: restAccr, end: restEnd }
    };
  });
  return report;
};

// 특정 시점의 잔액 합계 (기말 기준)
const sumBalanceAtDate = (leases, dateStr, type) => {
  let total = 0;
  const targetDate = new Date(dateStr);
  
  leases.forEach(lease => {
    const calc = lease.calculatedData;
    if (!calc || !calc.schedule) return;
    
    const startDate = new Date(lease.startDate);
    const endDate = new Date(lease.endDate);
    
    if (targetDate < startDate || targetDate > endDate) return;

    // 해당 월까지의 스케줄 찾기 (정확한 달력월 기반 — 기존 /30일 근사 개선)
    const idx = monthsElapsedInclusive(lease.startDate, dateStr);
    const scheduleRow = calc.schedule[Math.max(0, Math.min(idx-1, calc.schedule.length - 1))];
    
    if (scheduleRow) {
      if (type === 'liability') {
        total += scheduleRow.endLiability;
      } else if (type === 'rou') {
        total += scheduleRow.netBookValue;
      }
    }
  });
  
  return total;
};

// 신규 리스의 초기 잔액 합계
const sumInitialBalances = (leases, fiscalYear, type) => {
  let total = 0;
  leases.forEach(lease => {
    const calc = lease.calculatedData;
    if (!calc) return;
    
    const startYear = new Date(lease.startDate).getFullYear();
    if (startYear === fiscalYear) {
      if (type === 'liability') {
        total += calc.initialLiability || 0;
      } else if (type === 'rou') {
        total += calc.initialROU || 0;
      }
    }
  });
  return total;
};

// 기간 중 발생액 합계 (이자비용, 원금상환, 감가상각)
const sumPeriodItems = (leases, fiscalYear, type) => {
  let total = 0;
  const fyStart = new Date(`${fiscalYear}-01-01`);
  const fyEnd = new Date(`${fiscalYear}-12-31`);
  
  leases.forEach(lease => {
    const calc = lease.calculatedData;
    if (!calc || !calc.schedule) return;
    
    calc.schedule.forEach(row => {
      const rowDate = new Date(lease.startDate);
      rowDate.setMonth(rowDate.getMonth() + row.period - 1);
      
      if (rowDate >= fyStart && rowDate <= fyEnd) {
        if (type === 'interest') {
          total += row.interest || 0;
        } else if (type === 'principal') {
          total += row.principal || 0;
        } else if (type === 'depreciation') {
          total += row.monthlyDepreciation || 0;
        }
      }
    });
  });
  
  return total;
};

  const calcDiff = (leaseId) => {
    const versions = leaseGroups[leaseId] || [];
    if (versions.length < 2) return [];

    const diffs = [];
    for (let i = 1; i < versions.length; i++) {
      const v1 = versions[i-1];
      const v2 = versions[i];
      const c1 = v1.calculatedData;
      const c2 = v2.calculatedData;

      if (!c1 || !c2 || c1.error || c2.error) continue;

      const liabBefore = parseFloat(v2.carriedOverLiability || 0);
      const liabAfter = c2.initialLiability;
      const rouBefore = parseFloat(v2.carriedOverROU || 0);
      const rouAfter = c2.initialROU;

      diffs.push({
        v1, v2,
        modDate: v2.startDate,
        liabBefore,
        liabAfter,
        liabDiff: liabAfter - liabBefore,
        rouBefore,
        rouAfter,
        rouDiff: rouAfter - rouBefore
      });
    }
    return diffs;
  };

              restorationRate: row['복구충당할인율(%)'] ? String(row['복구충당할인율(%)']) : '',
              rateMethod: String(row['할인율환산']||'compound'),
              depreciationMethod: String(row['상각방식']||'straight'),
              liabilityMethod: String(row['상환배분']||'effective'),

              computedAt: new Date().toISOString(),
              customPayments: String(row['변동리스료']||''),
              notes: String(row['비고']||''),

            lease.calculatedData = computeLease(lease);
            if (lease.calculatedData.error) {

              return;
            }
            newLeases.push(lease);
          });

        }
        e.target.value='';
      } catch(err) {

      }
    };
    reader.readAsBinaryString(file);

// [F7] 백업 이력 복원 컴포넌트
const BackupHistory = ({ setLeases }) => {
  const [hist, setHist] = useState([]);
  useEffect(() => {
    try { setHist(JSON.parse(localStorage.getItem('leaseData_history')||'[]')); } catch(e){ setHist([]); }
  }, []);
  if (hist.length === 0) return <div className="text-sm text-slate-600">저장된 백업 이력이 없습니다. 리스를 등록하면 자동 스냅샷이 생성됩니다.</div>;
  return (
    <div className="space-y-1.5">
      {[...hist].reverse().map((h, i) => (
        <div key={i} className="flex items-center justify-between bg-slate-900/50 rounded px-3 py-2 text-sm">
          <div><span className="font-mono text-xs text-slate-400">{new Date(h.ts).toLocaleString('ko-KR')}</span> <span className="ml-2">{h.count}건</span></div>
          <button onClick={()=>{ if(confirm('이 스냅샷으로 복원하시겠습니까? 현재 데이터는 덮어써집니다.')){ setLeases(h.data.map(l=>({...l, calculatedData: computeLease(l)}))); alert('✅ 복원 완료'); } }}
            className="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs">복원</button>
        </div>
      ))}
      <div className="text-[10px] text-slate-500 mt-1">* 최근 10개 스냅샷 자동 보관 (내용 변경 시).</div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
